[package]
name = "taps-sc-extract-rs"
version = "0.1.0"
edition = "2021"
description = "Rust core for single-cell TAPS methylation extraction (Amethyst HDF5)"
license = "CC-BY-NC-4.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
hdf5-metno = { version = "0.14", features = ["blosc", "blosc-lz4", "blosc-zstd", "lzf"] }
libc = "0.2"
md-5 = "0.10"
mimalloc = { version = "0.1", default-features = false }
noodles = { version = "0.109.0", features = ["bam", "sam", "core", "bgzf"] }
rayon = "1.11"
rust-htslib = { version = "0.49", default-features = false, features = ["libdeflate"] }
rustc-hash = "2.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1

# hts-sys 2.2.1 with htslib 1.21's overlap clipping (see
# patches/hts-sys-2.2.1-overlap-deletions.patch). install.sh downloads the published
# crate into vendor/ and applies the patch.
[patch.crates-io]
hts-sys = { path = "vendor/hts-sys-2.2.1" }
