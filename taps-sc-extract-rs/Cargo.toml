[package]
name = "taps-sc-extract-rs"
version = "0.1.0"
edition = "2021"
description = "Rust core for single-cell TAPS methylation extraction (Amethyst HDF5)"
license = "CC-BY-NC-4.0"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = { version = "3.4", features = ["termination"] }
hdf5-metno = "0.14"
md-5 = "0.10"
mimalloc = { version = "0.1", default-features = false }
noodles = { version = "0.109.0", features = ["bam", "sam", "core", "bgzf"] }
rayon = "1.11"
rust-htslib = { version = "0.49", default-features = false }
rustc-hash = "2.1"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
